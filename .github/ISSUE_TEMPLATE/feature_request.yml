name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that schorm doesn't support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: >
        How might it work? For authoring-format changes, sketch the YAML or
        frontmatter you'd want to write.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
